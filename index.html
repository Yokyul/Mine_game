<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/index.css">
  <title>扫雷游戏</title>
</head>

<body>
  <div class="container">
    <h1>扫雷</h1>
    <div class="level">
      <button class="active">初级</button>
      <button>中级</button>
      <button>高级</button>
    </div>
    <div class="info">总雷数：<span class="mineNum"></span></div>
    <div class="info">插旗数：<span class="flagNum"></span></div>

    <div class="info">用时：<span class="timer">0</span> 秒</div>

    <!-- 扫雷区域，通过 JS 动态生成 -->
    <div class="mineArea"></div>

    <!-- 排行榜 -->
    <div class="leaderboard">
      <h2>排行榜</h2>
      <div class="leaderboard-tabs">
        <button class="lb-tab active" data-level="easy">初级</button>
        <button class="lb-tab" data-level="normal">中级</button>
        <button class="lb-tab" data-level="hard">高级</button>
      </div>
      <table class="lb-table">
        <thead>
          <tr>
            <th>排名</th>
            <th>用时（秒）</th>
            <th>日期</th>
          </tr>
        </thead>
        <tbody class="lb-body"></tbody>
      </table>
      <p class="lb-empty">暂无记录</p>
    </div>
  </div>

  <script src="./index.js" type="module"></script>
</body>

</html>
